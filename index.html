<!DOCTYPE html>
<html>
<head>
    <meta name="color-scheme" content="light dark">
    <script type="text/javascript" src="choices.js"></script>
</head>
<body style="margin: 0; display: flex; height: 100vh; background-color: #1c0029;">
    <div style="flex-basis: 14%; background-color: #1c0029; padding: 40px; box-sizing: border-box;">
    </div>
    <div style="flex-basis: 72%; display: flex; flex-direction: column; box-sizing: border-box; background-color: #1c0029;">
        <div style="flex-basis: 14%; background-color: #1c0029; padding: 40px; box-sizing: border-box;">
        </div>
        <div style="flex-basis: 72%; justify-content: center; height: 100%; background-color: #721cbd; padding: 50px; box-sizing: border-box; border-radius: 56px; border: 8px solid #270692; display: flex; flex-direction: column; gap: 40px; justify-content: space-between; overflow: hidden;">
            <textarea readonly id="qq0" style="flex: 1; width: 100%; resize: none; padding: 40px; box-sizing: border-box; font-size: 1.92rem; font-family: inherit; line-height: 1.5; font-weight: 500; background-color: #231c3d; color: #eae7f2; border: 2px solid #4a3b7d; border-radius: 24px; outline: none; box-shadow: inset 0 4px 16px rgba(0,0,0,0.3); display: flex; align-content: center; justify-content: center; text-align: center;">Where would you like to live?</textarea>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 30px;">
                <div style="flex: 1; display: flex; gap: 30px;">
                    <button onclick="choices(0)" style="flex: 1; text-align: center; padding: 30px 50px; background-color: #20134c; color: #f0edf5; border: 2px solid #5c479e; border-radius: 24px; font-size: 2.6rem; font-family: inherit; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 8px 12px rgba(0,0,0,0.15);">
                        <span id="q0" style="color: #b70000; font-weight: bold; margin-right: 24px; ">City</span>
                    </button>
                    <button onclick="choices(1)" style="flex: 1; text-align: center; padding: 30px 50px; background-color: #20134c; color: #f0edf5; border: 2px solid #5c479e; border-radius: 24px; font-size: 2.6rem; font-family: inherit; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 8px 12px rgba(0,0,0,0.15);">
                        <span id="q1" style="color: #199600; font-weight: bold; margin-right: 24px;">Sea</span>
                    </button>
                </div>
                <div style="flex: 1; display: flex; gap: 30px;">
                    <button onclick="choices(2)" style="flex: 1; text-align: center; padding: 30px 50px; background-color: #20134c; color: #f0edf5; border: 2px solid #5c479e; border-radius: 24px; font-size: 2.6rem; font-family: inherit; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 8px 12px rgba(0,0,0,0.15);">
                        <span id="q2" style="color: #e7d000; font-weight: bold; margin-right: 24px;">Mountain</span>
                    </button>
                    <button onclick="choices(3)" style="flex: 1; text-align: center; padding: 30px 50px; background-color: #20134c; color: #f0edf5; border: 2px solid #5c479e; border-radius: 24px; font-size: 2.6rem; font-family: inherit; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 8px 12px rgba(0,0,0,0.15);">
                        <span id="q3" style="color: #02afce; font-weight: bold; margin-right: 24px;">Traveling</span>
                    </button>
                </div>
            </div>
        </div>
        <div style="flex-basis: 14%; background-color: #1c0029; padding: 40px; box-sizing: border-box;">
        </div>
    </div>
    <div style="flex-basis: 14%; background-color: #1c0029; padding: 40px; box-sizing: border-box;">
    </div>
</body>
</html>
